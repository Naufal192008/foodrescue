name: foodrescue
description: "FoodRescue surplus food rescue MVP"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  intl: ^0.19.0
  qr_flutter: ^4.1.0
  google_fonts: ^6.2.1
  flutter_rating_bar: ^4.0.1
  crypto: ^3.0.3
  flutter_dotenv: ^5.1.0
  flutter_secure_storage: ^9.2.4
  http: ^1.6.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/logo.jpeg

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/logo.jpeg